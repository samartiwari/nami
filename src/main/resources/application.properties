spring.application.name=nami

# Auto-run the crawler on startup? Off while dump-loading / benchmarking search.
# Flip to true to have the app crawl live Wikipedia on boot again.
nami.crawler.enabled=false

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
# Still in the ARCHITECTURE phase: keep create-drop so each boot is a clean slate
# while schema/indexing/stemming are still changing. Flip to "update" only when the
# architecture can store + serve ~1M pages, then start the real accumulating crawl.
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=create-drop

# Run schema.sql on startup. Safe to re-run (pg_trgm extension + GIN index both use
# IF NOT EXISTS, so they no-op when already present).
# defer-datasource-initialization lets Hibernate build/verify tables first, then schema.sql runs.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true