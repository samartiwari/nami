spring.application.name=nami

# Auto-run the crawler on startup. On: the app crawls live Wikipedia on boot,
# resuming from PENDING urls in the frontier (so it continues across restarts).
nami.crawler.enabled=true

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
# Switched to "update": the corpus is now worth keeping, so data persists across
# restarts instead of being dropped. (create-drop drops tables on shutdown — a
# graceful stop would wipe everything, so the running create-drop instance must be
# HARD-killed before the first restart on this setting.)
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create-drop

# Run schema.sql on startup. Safe to re-run (pg_trgm extension + GIN index both use
# IF NOT EXISTS, so they no-op when already present).
# defer-datasource-initialization lets Hibernate build/verify tables first, then schema.sql runs.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true