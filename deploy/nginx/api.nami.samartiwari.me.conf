# https://api.nami.samartiwari.me, served by the nginx that already fronts MiddleBerth
# on the same server. That nginx includes every file in /srv/nginx-sites, and
# setup-server.sh copies this file there only after the certificate exists, so nginx
# is never asked to load a certificate it does not have.

# `resolve` looks the app up again every 5 seconds, so a rebuilt app container is
# found at its new address without restarting nginx.
upstream nami {
    zone nami 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server nami-app:8080 resolve;
    keepalive 64;
}

server {
    listen 80;
    server_name api.nami.samartiwari.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.nami.samartiwari.me;

    ssl_certificate     /etc/letsencrypt/live/api.nami.samartiwari.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nami.samartiwari.me/privkey.pem;

    location / {
        proxy_pass http://nami;

        # HTTP/1.1 and no "Connection: close", so connections to the app are reused.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout    30s;
    }
}
